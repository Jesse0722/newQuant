name: Quality

on:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newquant_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newquant_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlite:////tmp/newquant-ci.db
      AUTO_INIT_DB: "false"
      AUTO_START_SCHEDULER: "false"
      SCHEDULER_ENABLED: "false"
      QUOTE_REPAIR_POSTGRES_ADMIN_URL: postgresql+psycopg://newquant_test:test-only-password@127.0.0.1:5432/postgres
      RUNTIME_POSTGRES_TEST_URL: postgresql+psycopg://newquant_test:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies and PostgreSQL tools
        run: |
          python -m pip install -r backend/requirements.lock
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Unit and isolated API regression
        working-directory: backend
        run: python -m pytest -q
      - name: Real PostgreSQL migrations, API smoke, copy and restore
        working-directory: backend
        run: python -m pytest -q --run-integration tests/test_postgres_reliability.py tests/test_quote_repair_postgres.py tests/test_runtime_postgres.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Isolated browser regression
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results/
