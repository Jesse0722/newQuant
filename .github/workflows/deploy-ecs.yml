name: Deploy ECS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-ecs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            APP_DIR=/opt/newquant \
            REPO_DIR=/root/newQuant \
            REPO_URL=https://github.com/Jesse0722/newQuant.git \
            BRANCH=master \
            bash /opt/newquant/deploy-local-build.sh
