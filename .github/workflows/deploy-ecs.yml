name: Deploy ECS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.ECS_HOST }}" || (echo "ECS_HOST is missing" && exit 1)
          test -n "${{ secrets.ECS_USER }}" || (echo "ECS_USER is missing" && exit 1)
          test -n "${{ secrets.ECS_SSH_KEY }}" || (echo "ECS_SSH_KEY is missing" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_key
          chmod 600 ~/.ssh/ecs_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to ECS
        run: |
          ssh -i ~/.ssh/ecs_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" bash -s -- '${{ github.sha }}' <<'REMOTE'
          set -euo pipefail
          revision="$1"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          repo=/root/newQuant
          if [[ ! -d "$repo/.git" ]]; then
            git clone --no-checkout https://github.com/Jesse0722/newQuant.git "$repo"
          fi
          git -C "$repo" fetch origin master
          script=$(mktemp /tmp/newquant-deploy.XXXXXX)
          trap 'rm -f "$script"' EXIT
          git -C "$repo" show "$revision:deploy/aliyun/deploy-local-build.sh" > "$script"
          APP_DIR=/opt/newquant REPO_DIR="$repo" BRANCH=master DEPLOY_REVISION="$revision" bash "$script"
          REMOTE
