services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: newquant-backend:latest
    restart: always
    env_file:
      - ./backend.env
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: newquant-frontend:latest
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
